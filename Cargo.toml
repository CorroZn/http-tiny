[package]
name = "http-tiny"
authors = ["CorroZn <corrozn@proton.me>"]
version = "0.2.5"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/CorroZn/http-tiny"
description = "A tiny HTTP server intented for use in constrained systems."

[dependencies]
clap = { version = "4", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "string",
    "usage",
] }
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }

[lints.clippy]
all = "deny"
pedantic = "warn"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[profile.dev]
overflow-checks = true
debug = 2

[profile.test]
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
debug = false
