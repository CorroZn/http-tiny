[package]
name = "http-tiny"
authors = ["CorroZn <corrozn@proton.me>"]
version = "0.2.6"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/CorroZn/http-tiny"
description = "A tiny HTTP server intented for use in constrained systems."

[lints]
workspace = true

[dependencies]
clap = { version = "4", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "string",
    "usage",
] }
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }

[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
# Keep overflow checks enabled in the deployable server.
overflow-checks = true
# Reduce the static artifact size for constrained deployments.
strip = "symbols"
